<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAKSHA-KL // Kerala Emergency Disaster Management</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@600;700;900&display=swap" rel="stylesheet">
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'neo-bg': '#FFFDF5',
            'neo-red': '#FF4B4B',
            'neo-yellow': '#FFE600',
            'neo-cyan': '#00E5FF',
            'neo-green': '#00F076',
            'neo-purple': '#B88BFF',
            'neo-orange': '#FF8800',
          },
          boxShadow: {
            'neo-sm': '2px 2px 0px 0px #000000',
            'neo': '4px 4px 0px 0px #000000',
            'neo-lg': '6px 6px 0px 0px #000000',
            'neo-xl': '8px 8px 0px 0px #000000',
          },
          borderWidth: { '3': '3px' },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            body: ['"Inter"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FFFDF5;
      font-family: 'Inter', sans-serif;
      color: #000;
    }
    .neo-box {
      background-color: #ffffff;
      border: 3px solid #000000;
      box-shadow: 4px 4px 0px 0px #000000;
    }
    .neo-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      border: 3px solid #000000;
      box-shadow: 4px 4px 0px 0px #000000;
      transition: all 0.1s ease;
      cursor: pointer;
      user-select: none;
    }
    .neo-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px 0px #000000;
    }
    .neo-input {
      border: 3px solid #000000;
      background-color: #ffffff;
      box-shadow: 3px 3px 0px 0px #000000;
      font-weight: 700;
      outline: none;
    }
    .neo-input:focus {
      background-color: #FFFDF5;
      box-shadow: 5px 5px 0px 0px #000000;
    }
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee 30s linear infinite;
    }
  </style>
</head>
<body class="selection:bg-neo-yellow selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const KERALA_DISTRICTS = [
      'Thiruvananthapuram', 'Kollam', 'Pathanamthitta', 'Alappuzha', 
      'Kottayam', 'Idukki', 'Ernakulam', 'Thrissur', 'Palakkad', 
      'Malappuram', 'Kozhikode', 'Wayanad', 'Kannur', 'Kasaragod'
    ];

    const DISTRICT_ALERTS = {
      Wayanad: { level: 'RED', rainfall: '204mm', advisory: 'Severe Landslide Warning. Evacuate slopes.' },
      Idukki: { level: 'RED', rainfall: '185mm', advisory: 'Dam shutter alert. Flash flood risk in Periyar basin.' },
      Alappuzha: { level: 'ORANGE', rainfall: '115mm', advisory: 'Kuttanad waterlogging. Boat squads on standby.' },
      Ernakulam: { level: 'ORANGE', rainfall: '98mm', advisory: 'High tide storm surge warning along coast.' },
      Thrissur: { level: 'YELLOW', rainfall: '60mm', advisory: 'Reservoirs approaching buffer thresholds.' },
      Malappuram: { level: 'YELLOW', rainfall: '65mm', advisory: 'Continuous rainfall along riverbanks.' },
    };

    const INITIAL_DAMS = [
      { name: 'Idukki Arch Dam', district: 'Idukki', current: 2398.5, max: 2403.0, unit: 'ft', status: 'ORANGE_ALERT', shutters: '2 Gates Raised (40cm)', discharge: '150 m³/s' },
      { name: 'Mullaperiyar Dam', district: 'Idukki', current: 139.8, max: 142.0, unit: 'ft', status: 'RED_ALERT', shutters: '4 Spillway Gates Open', discharge: '320 m³/s' },
      { name: 'Banasura Sagar Dam', district: 'Wayanad', current: 774.2, max: 775.6, unit: 'm', status: 'RED_ALERT', shutters: '1 Gate Open (15cm)', discharge: '85 m³/s' },
      { name: 'Malampuzha Dam', district: 'Palakkad', current: 112.4, max: 115.0, unit: 'm', status: 'YELLOW_ALERT', shutters: 'Closed (Monitoring)', discharge: '0 m³/s' },
    ];

    const INITIAL_CAMPS = [
      {
        id: 'camp-1',
        name: 'Meppadi Govt Higher Secondary School Camp',
        district: 'Wayanad',
        taluk: 'Vythiri',
        phone: '+91 94471 23456',
        capacity: 450,
        occupancy: 385,
        needed: [
          { item: 'Dry Rations (Rice, Dhal)', qty: '500 kg', status: 'HIGH' },
          { item: 'Infant Formula & Baby Food', qty: '80 cans', status: 'URGENT' },
          { item: 'Doxycycline & ORS sachets', qty: '300 strips', status: 'URGENT' }
        ]
      },
      {
        id: 'camp-2',
        name: 'Kainakary St. Marys School Relief Centre',
        district: 'Alappuzha',
        taluk: 'Kuttanad',
        phone: '+91 98460 78901',
        capacity: 600,
        occupancy: 490,
        needed: [
          { item: 'Drinking Water Cans (20L)', qty: '200 cans', status: 'URGENT' },
          { item: 'Sanitary Napkins', qty: '250 packs', status: 'HIGH' },
          { item: 'Mosquito Nets', qty: '180 units', status: 'HIGH' }
        ]
      }
    ];

    const INITIAL_SOS = [
      {
        id: 'KL-SOS-883921',
        name: 'Unnikrishnan Nair',
        phone: '9447812903',
        district: 'Wayanad',
        taluk: 'Chooralmala',
        waterLevel: 'Chest Deep',
        people: { total: 6, bedridden: 1 },
        priority: 'P1_CRITICAL',
        status: 'PENDING',
        image: 'https://images.unsplash.com/photo-1547683905-f686c993aae5?auto=format&fit=crop&w=800&q=80',
        notes: 'Elderly bedridden patient requires insulin & oxygen cylinder'
      },
      {
        id: 'KL-SOS-441209',
        name: 'Mercy Mathew',
        phone: '9846198273',
        district: 'Alappuzha',
        taluk: 'Nedumudi, Kuttanad',
        waterLevel: 'Waist Deep',
        people: { total: 4, bedridden: 0 },
        priority: 'P2_URGENT',
        status: 'DISPATCHED',
        image: 'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?auto=format&fit=crop&w=800&q=80',
        notes: 'House surrounded by Pamba floodwaters, drinking water contaminated'
      }
    ];

    function App() {
      const [tab, setTab] = useState('sos');
      const [lang, setLang] = useState('en');
      const [sosList, setSosList] = useState(INITIAL_SOS);
      const [camps, setCamps] = useState(INITIAL_CAMPS);
      const [submitted, setSubmitted] = useState(null);

      // SOS Form State
      const [form, setForm] = useState({
        phone: '',
        name: '',
        district: 'Wayanad',
        taluk: 'Chooralmala',
        waterLevel: 'Waist Deep',
        totalPeople: 4,
        bedridden: 0,
        medicalNotes: '',
        images: []
      });

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => {
          setForm(prev => ({
            ...prev,
            images: [reader.result]
          }));
        };
        reader.readAsDataURL(file);
      };

      const handleSOSSubmit = (e) => {
        e.preventDefault();
        const id = 'KL-SOS-' + Math.floor(100000 + Math.random() * 900000);
        let priority = (form.waterLevel === 'Chest Deep' || form.waterLevel === 'Rooftop Stranded' || form.bedridden > 0) ? 'P1_CRITICAL' : 'P2_URGENT';
        
        const newTicket = {
          id,
          name: form.name || 'Anonymous Citizen',
          phone: form.phone,
          district: form.district,
          taluk: form.taluk,
          waterLevel: form.waterLevel,
          people: { total: Number(form.totalPeople), bedridden: Number(form.bedridden) },
          priority,
          status: 'PENDING',
          image: form.images[0] || 'https://images.unsplash.com/photo-1547683905-f686c993aae5?auto=format&fit=crop&w=800&q=80',
          notes: form.medicalNotes || 'Emergency rescue assistance requested'
        };

        setSosList([newTicket, ...sosList]);
        setSubmitted(newTicket);
      };

      const handleStatusChange = (id, newStatus) => {
        setSosList(sosList.map(s => s.id === id ? { ...s, status: newStatus } : s));
      };

      const handlePledgeAid = (campId, idx) => {
        setCamps(camps.map(c => {
          if (c.id === campId) {
            const updated = [...c.needed];
            updated[idx].status = 'FULFILLED ✓';
            return { ...c, needed: updated };
          }
          return c;
        }));
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Urgent Marquee Ticker */}
          <div className="bg-neo-red border-b-3 border-black text-white px-3 py-1.5 overflow-hidden flex items-center font-black text-xs md:text-sm">
            <span className="bg-black text-neo-yellow px-2 py-0.5 border border-black mr-3 shrink-0">KSDMA LIVE</span>
            <div className="overflow-hidden whitespace-nowrap">
              <div className="animate-marquee">
                WAYANAD: RED ALERT (204mm) • IDUKKI: RED ALERT (185mm) • ALAPPUZHA: ORANGE ALERT • STATE CONTROL: 1077 • POLICE: 112 • COASTAL RESCUE: 1093  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
              </div>
            </div>
          </div>

          {/* Navigation Bar */}
          <header className="bg-neo-bg border-b-4 border-black px-4 py-3 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 bg-neo-yellow border-3 border-black shadow-neo flex items-center justify-center font-black text-2xl -rotate-2">
                  🌊
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-display font-black text-2xl md:text-3xl text-black">
                      RAKSHA<span className="text-neo-red">-KL</span>
                    </span>
                    <span className="bg-neo-green px-2 py-0.5 text-[11px] font-black border-2 border-black shadow-neo-sm">
                      24/7 LIVE
                    </span>
                  </div>
                  <p className="text-xs font-bold text-gray-700">
                    {lang === 'ml' ? 'കേരള ദുരന്ത നിവാരണ കൺട്രോൾ പോർട്ടൽ' : 'KERALA EMERGENCY DISASTER RESPONSE PLATFORM'}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <a href="tel:1077" className="neo-btn bg-neo-yellow px-3 py-1.5 text-xs font-black">
                  📞 KSDMA: 1077
                </a>
                <button
                  onClick={() => setLang(lang === 'en' ? 'ml' : 'en')}
                  className="neo-btn bg-neo-cyan px-3 py-1.5 text-xs font-black"
                >
                  {lang === 'en' ? 'മലയാളം (ML)' : 'ENGLISH (EN)'}
                </button>
              </div>
            </div>

            {/* Neo-brutalist Tab Selector */}
            <div className="max-w-7xl mx-auto flex gap-2 pt-3 overflow-x-auto">
              {[
                { id: 'sos', label: '🚨 EMERGENCY SOS' },
                { id: 'control', label: '🗺️ CONTROL ROOM & TRIAGE' },
                { id: 'camps', label: '🏕️ RELIEF CAMPS' },
                { id: 'dams', label: '🌊 DAM LEVELS & RADAR' },
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`px-4 py-2 text-xs md:text-sm font-black uppercase border-3 border-black whitespace-nowrap transition-all ${
                    tab === t.id ? 'bg-black text-neo-yellow shadow-neo -translate-y-0.5' : 'bg-white text-black hover:bg-yellow-50 shadow-neo-sm'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>
          </header>

          {/* Main Views */}
          <main className="flex-1 max-w-7xl mx-auto p-4 md:p-6 w-full">
            {/* VIEW 1: SOS FORM */}
            {tab === 'sos' && (
              <div className="max-w-3xl mx-auto">
                <div className="bg-neo-red border-4 border-black p-5 shadow-neo-lg text-white mb-6">
                  <h1 className="font-display font-black text-2xl md:text-3xl uppercase">
                    🚨 EMERGENCY RESCUE SOS BROADCAST
                  </h1>
                  <p className="text-xs md:text-sm font-bold mt-1">
                    Fill this form to notify KSDMA District Control Rooms, NDRF, and Kerala fishermen boat squads.
                  </p>
                </div>

                {submitted ? (
                  <div className="neo-box p-6 bg-white border-4 border-black shadow-neo-xl">
                    <span className="bg-neo-green text-black px-2 py-0.5 text-xs font-black uppercase border-2 border-black">
                      TRANSMITTED TO CONTROL ROOM ✓
                    </span>
                    <h2 className="font-display font-black text-2xl mt-2">
                      RESCUE TICKET #{submitted.id}
                    </h2>
                    <div className="bg-neo-yellow border-2 border-black p-3 my-4 text-xs font-bold">
                      <p>District: {submitted.district} • Taluk: {submitted.taluk}</p>
                      <p>Trapped: {submitted.people.total} people • Water Level: {submitted.waterLevel}</p>
                      <p className="text-neo-red font-black mt-1">Priority: {submitted.priority}</p>
                    </div>

                    <div className="bg-neo-bg border-2 border-black p-3 mb-4 text-xs">
                      <span className="font-black block mb-1">OFFLINE SMS BACKUP:</span>
                      <a 
                        href={`sms:1077?body=EMERGENCY SOS: ${submitted.id} at ${submitted.district}, ${submitted.people.total} people trapped, water: ${submitted.waterLevel}`}
                        className="neo-btn bg-black text-neo-yellow px-4 py-2 text-xs font-black w-full text-center"
                      >
                        SEND AUTO SMS TO 1077
                      </a>
                    </div>

                    <button
                      onClick={() => setSubmitted(null)}
                      className="neo-btn bg-neo-cyan px-4 py-2 text-xs font-black w-full"
                    >
                      SUBMIT ANOTHER RESCUE REQUEST
                    </button>
                  </div>
                ) : (
                  <form onSubmit={handleSOSSubmit} className="neo-box p-6 bg-white border-4 border-black shadow-neo-xl space-y-5">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-black uppercase mb-1">Contact Phone Number *</label>
                        <input
                          type="tel"
                          required
                          placeholder="e.g. 9447123456"
                          value={form.phone}
                          onChange={e => setForm({ ...form, phone: e.target.value })}
                          className="neo-input w-full p-2 text-xs"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-black uppercase mb-1">Your Name</label>
                        <input
                          type="text"
                          placeholder="e.g. Suresh Kumar"
                          value={form.name}
                          onChange={e => setForm({ ...form, name: e.target.value })}
                          className="neo-input w-full p-2 text-xs"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-black uppercase mb-1">Kerala District *</label>
                        <select
                          value={form.district}
                          onChange={e => setForm({ ...form, district: e.target.value })}
                          className="neo-input w-full p-2 text-xs font-bold bg-white"
                        >
                          {KERALA_DISTRICTS.map(d => <option key={d} value={d}>{d}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-black uppercase mb-1">Taluk / Village / Town</label>
                        <input
                          type="text"
                          placeholder="e.g. Vythiri / Chooralmala"
                          value={form.taluk}
                          onChange={e => setForm({ ...form, taluk: e.target.value })}
                          className="neo-input w-full p-2 text-xs"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-black uppercase mb-1">Flood Water Level</label>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        {['Ankle Deep', 'Waist Deep', 'Chest Deep', 'Rooftop Stranded'].map(lvl => (
                          <button
                            type="button"
                            key={lvl}
                            onClick={() => setForm({ ...form, waterLevel: lvl })}
                            className={`p-2 text-xs font-black border-2 border-black uppercase ${
                              form.waterLevel === lvl ? 'bg-neo-red text-white shadow-neo-sm ring-2 ring-black' : 'bg-white'
                            }`}
                          >
                            {lvl}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div className="bg-neo-bg border-2 border-black p-3">
                        <label className="block text-xs font-black uppercase mb-1">Total People Stranded</label>
                        <input
                          type="number"
                          min="1"
                          value={form.totalPeople}
                          onChange={e => setForm({ ...form, totalPeople: e.target.value })}
                          className="neo-input w-full p-1.5 text-center font-black"
                        />
                      </div>
                      <div className="bg-neo-bg border-2 border-black p-3">
                        <label className="block text-xs font-black uppercase mb-1 text-neo-red">Bedridden / Critical</label>
                        <input
                          type="number"
                          min="0"
                          value={form.bedridden}
                          onChange={e => setForm({ ...form, bedridden: e.target.value })}
                          className="neo-input w-full p-1.5 text-center font-black text-neo-red"
                        />
                      </div>
                    </div>

                    {/* Cloudinary Visual Upload */}
                    <div className="border-3 border-dashed border-black p-4 bg-neo-bg text-center relative">
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handleImageUpload}
                        className="absolute inset-0 opacity-0 cursor-pointer"
                      />
                      <span className="font-black text-xs uppercase block">📸 ATTACH DAMAGE PHOTO (CLOUDINARY PIPELINE)</span>
                      <span className="text-[11px] text-gray-600 block mt-1">Tap to snap camera photo or choose file. Auto-compressed for 2G networks.</span>
                    </div>

                    {form.images.length > 0 && (
                      <div className="border-2 border-black p-2 bg-white flex items-center gap-3">
                        <img src={form.images[0]} className="w-16 h-14 object-cover border border-black" />
                        <span className="text-xs font-black text-neo-green bg-black px-2 py-0.5 border border-black">
                          IMAGE READY FOR CLOUDINARY UPLOAD
                        </span>
                      </div>
                    )}

                    <button
                      type="submit"
                      className="neo-btn bg-neo-red text-white py-3 px-6 text-base font-black w-full uppercase shadow-neo-lg hover:bg-red-600"
                    >
                      🚨 TRANSMIT EMERGENCY RESCUE SOS NOW
                    </button>
                  </form>
                )}
              </div>
            )}

            {/* VIEW 2: CONTROL ROOM & TRIAGE */}
            {tab === 'control' && (
              <div>
                <div className="bg-black text-neo-yellow border-4 border-black p-4 shadow-neo mb-6 flex justify-between items-center flex-wrap gap-2">
                  <h2 className="font-display font-black text-xl md:text-2xl uppercase">
                    KSDMA LIVE RESCUE TRIAGE COMMAND
                  </h2>
                  <span className="bg-neo-red text-white text-xs font-black px-2.5 py-1 border border-neo-yellow">
                    {sosList.filter(s => s.status !== 'RESCUED').length} ACTIVE MISSIONS
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {/* PENDING */}
                  <div className="space-y-3">
                    <div className="bg-neo-red text-white p-2 border-3 border-black font-black text-xs uppercase flex justify-between">
                      <span>1. PENDING TRIAGE ({sosList.filter(s => s.status === 'PENDING').length})</span>
                      <span>CRITICAL</span>
                    </div>
                    {sosList.filter(s => s.status === 'PENDING').map(item => (
                      <div key={item.id} className="neo-box p-4 bg-white border-3 border-black shadow-neo-sm">
                        <div className="flex justify-between text-[10px] font-black mb-1">
                          <span className="bg-black text-neo-yellow px-1.5 py-0.5 border border-black">{item.district}</span>
                          <span className="bg-neo-red text-white px-1.5 py-0.5 border border-black">{item.priority}</span>
                        </div>
                        <h4 className="font-display font-black text-base">{item.name}</h4>
                        <p className="text-xs font-bold text-gray-700">{item.taluk} • {item.waterLevel}</p>
                        <p className="text-xs font-black mt-1">Stranded: {item.people.total} people</p>
                        {item.image && (
                          <img src={item.image} className="w-full h-28 object-cover border-2 border-black my-2" />
                        )}
                        <p className="text-[11px] font-semibold bg-neo-bg p-1.5 border border-black mb-2">
                          ⚠️ {item.notes}
                        </p>
                        <div className="flex gap-2">
                          <a href={`tel:${item.phone}`} className="neo-btn bg-white px-2 py-1 text-[11px] font-black flex-1">
                            CALL
                          </a>
                          <button
                            onClick={() => handleStatusChange(item.id, 'DISPATCHED')}
                            className="neo-btn bg-neo-yellow px-2 py-1 text-[11px] font-black flex-1"
                          >
                            DISPATCH BOAT
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* DISPATCHED */}
                  <div className="space-y-3">
                    <div className="bg-neo-yellow text-black p-2 border-3 border-black font-black text-xs uppercase flex justify-between">
                      <span>2. BOAT EN ROUTE ({sosList.filter(s => s.status === 'DISPATCHED').length})</span>
                      <span>ACTIVE</span>
                    </div>
                    {sosList.filter(s => s.status === 'DISPATCHED').map(item => (
                      <div key={item.id} className="neo-box p-4 bg-white border-3 border-black shadow-neo-sm">
                        <div className="flex justify-between text-[10px] font-black mb-1">
                          <span className="bg-black text-neo-yellow px-1.5 py-0.5 border border-black">{item.district}</span>
                          <span className="bg-neo-green text-black px-1.5 py-0.5 border border-black">BOAT ASSIGNED</span>
                        </div>
                        <h4 className="font-display font-black text-base">{item.name}</h4>
                        <p className="text-xs font-bold text-gray-700">{item.taluk} • {item.waterLevel}</p>
                        <p className="text-xs font-black mt-1">Stranded: {item.people.total} people</p>
                        <button
                          onClick={() => handleStatusChange(item.id, 'RESCUED')}
                          className="neo-btn bg-neo-green text-black px-2 py-1 text-[11px] font-black w-full mt-2"
                        >
                          MARK AS SAFELY RESCUED ✓
                        </button>
                      </div>
                    ))}
                  </div>

                  {/* RESCUED */}
                  <div className="space-y-3">
                    <div className="bg-neo-green text-black p-2 border-3 border-black font-black text-xs uppercase flex justify-between">
                      <span>3. EVACUATED TO CAMP ({sosList.filter(s => s.status === 'RESCUED').length})</span>
                      <span>SAFE</span>
                    </div>
                    {sosList.filter(s => s.status === 'RESCUED').map(item => (
                      <div key={item.id} className="neo-box p-4 bg-white border-3 border-black shadow-neo-sm opacity-90">
                        <span className="bg-neo-green text-black text-[10px] font-black px-1.5 py-0.5 border border-black">
                          SHELTERED SAFE
                        </span>
                        <h4 className="font-display font-black text-base mt-1">{item.name}</h4>
                        <p className="text-xs font-bold text-gray-700">{item.district} • {item.people.total} Rescued</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 3: RELIEF CAMPS */}
            {tab === 'camps' && (
              <div>
                <div className="bg-neo-yellow border-4 border-black p-4 shadow-neo mb-6">
                  <h2 className="font-display font-black text-xl md:text-2xl uppercase">
                    KERALA RELIEF CAMPS & RESOURCE LOGISTICS
                  </h2>
                  <p className="text-xs font-bold">Real-time bed occupancy and urgent relief aid wishlists.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {camps.map(camp => (
                    <div key={camp.id} className="neo-box p-5 bg-white border-3 border-black shadow-neo">
                      <span className="bg-black text-neo-yellow text-[10px] font-black uppercase px-2 py-0.5 border border-black">
                        {camp.district} • {camp.taluk}
                      </span>
                      <h3 className="font-display font-black text-lg mt-1">{camp.name}</h3>
                      <p className="text-xs font-bold text-gray-700">Phone: {camp.phone}</p>

                      <div className="my-3 bg-neo-bg border-2 border-black p-2">
                        <div className="flex justify-between text-xs font-black mb-1">
                          <span>OCCUPANCY: {camp.occupancy} / {camp.capacity}</span>
                          <span>{Math.round((camp.occupancy / camp.capacity) * 100)}%</span>
                        </div>
                        <div className="w-full bg-white border border-black h-3">
                          <div className="bg-neo-cyan h-full" style={{ width: `${(camp.occupancy / camp.capacity) * 100}%` }}></div>
                        </div>
                      </div>

                      <h4 className="font-black text-xs uppercase mb-2">URGENT SUPPLIES NEEDED:</h4>
                      <div className="space-y-1.5">
                        {camp.needed.map((item, idx) => (
                          <div key={idx} className="flex justify-between items-center bg-neo-bg border border-black p-1.5 text-xs">
                            <span className="font-bold">{item.item} ({item.qty})</span>
                            {item.status.includes('✓') ? (
                              <span className="bg-neo-green font-black text-[10px] px-2 py-0.5 border border-black">{item.status}</span>
                            ) : (
                              <button
                                onClick={() => handlePledgeAid(camp.id, idx)}
                                className="neo-btn bg-neo-yellow text-black text-[10px] font-black px-2 py-0.5 uppercase"
                              >
                                PLEDGE AID
                              </button>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 4: DAM LEVELS & RADAR */}
            {tab === 'dams' && (
              <div>
                <div className="bg-neo-cyan border-4 border-black p-4 shadow-neo mb-6">
                  <h2 className="font-display font-black text-xl md:text-2xl uppercase">
                    KERALA DAM RESERVOIRS & IMD WEATHER RADAR
                  </h2>
                  <p className="text-xs font-bold">Real-time water levels, rule curve breach monitoring, and rainfall data.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                  {INITIAL_DAMS.map((dam, idx) => (
                    <div key={idx} className="neo-box p-4 bg-white border-3 border-black shadow-neo">
                      <span className={`text-[10px] font-black uppercase px-2 py-0.5 border border-black ${
                        dam.status === 'RED_ALERT' ? 'bg-neo-red text-white' : 'bg-neo-yellow text-black'
                      }`}>
                        {dam.status.replace('_', ' ')}
                      </span>
                      <h3 className="font-display font-black text-base mt-2">{dam.name}</h3>
                      <p className="text-xs font-bold text-gray-600">{dam.district}</p>

                      <div className="my-2 bg-neo-bg border-2 border-black p-2">
                        <span className="text-[10px] font-black block text-gray-500 uppercase">WATER LEVEL</span>
                        <span className="font-mono font-black text-xl">{dam.current} <span className="text-xs">{dam.unit}</span></span>
                        <span className="text-[10px] font-bold text-gray-600 block">Max FRL: {dam.max} {dam.unit}</span>
                      </div>

                      <p className="text-xs font-black text-neo-red">⚠️ {dam.shutters}</p>
                      <p className="text-[11px] font-bold text-gray-700">Discharge: {dam.discharge}</p>
                    </div>
                  ))}
                </div>

                <h3 className="font-display font-black text-lg uppercase mb-3 border-b-2 border-black pb-1">
                  14-DISTRICT IMD WARNING MATRIX
                </h3>
                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                  {Object.entries(DISTRICT_ALERTS).map(([dist, info]) => (
                    <div key={dist} className={`p-3 border-2 border-black shadow-neo-sm ${
                      info.level === 'RED' ? 'bg-red-100' : info.level === 'ORANGE' ? 'bg-amber-100' : 'bg-yellow-100'
                    }`}>
                      <span className={`text-[9px] font-black uppercase px-1.5 py-0.5 border border-black ${
                        info.level === 'RED' ? 'bg-neo-red text-white' : 'bg-neo-yellow text-black'
                      }`}>
                        {info.level}
                      </span>
                      <h4 className="font-display font-black text-sm mt-1">{dist}</h4>
                      <p className="text-[11px] font-mono font-bold mt-1">Rain: {info.rainfall}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="bg-black text-white border-t-4 border-black p-4 text-center text-xs font-bold">
            RAKSHA-KL // MERN STACK & CLOUDINARY DISASTER MANAGEMENT SYSTEM • NEO-BRUTALISM UI
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
